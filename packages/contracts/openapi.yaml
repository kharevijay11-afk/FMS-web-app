openapi: 3.1.0
info:
  title: FMS Web System API
  version: 0.3.0
  description: Step 3 API. PostgreSQL persistence is enabled by environment; synthetic mode remains the safe default for local tests.
servers: [{ url: 'http://127.0.0.1:3000/api/v1' }]
paths:
  /admin/dashboard/summary:
    get:
      summary: Permission-filtered read-only admin dashboard; synthetic snapshots explicitly labelled
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Dashboard counts, collections and previews; null means pending or restricted
          content:
            application/json:
              schema:
                $ref: "./admin-dashboard.schema.json"
        "401": { description: Authentication required }
        "403": { description: Admin dashboard permission required }
  /admin/navigation:
    get:
      summary: Server-authorized admin navigation
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Permitted routes only }
        "401": { description: Authentication required }
        "403": { description: Admin shell access denied }
  /admin/modules/{moduleId}:
    get:
      summary: Permission-checked Step 6Bâ€“6F placeholder
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: path, name: moduleId, required: true, schema: { type: string } }
      responses:
        "200": { description: Module integration pending }
        "401": { description: Authentication required }
        "403": { description: Module permission denied }
        "404": { description: Unknown module }
  /health:
    get: { operationId: health, responses: { '200': { description: Service and selected data-source status } } }
  /auth/login:
    post:
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: Student/staff session issued }, '202': { description: Privileged MFA challenge issued }, '401': { $ref: '#/components/responses/Error' } }
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [challengeId, code], properties: { challengeId: { type: string, format: uuid }, code: { type: string, pattern: '^\\d{6}$' } } } } } }
      responses: { '200': { description: MFA verified and session issued }, '401': { $ref: '#/components/responses/Error' } }
  /auth/logout:
    post: { operationId: logout, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '200': { description: Persistent session revoked }, '403': { $ref: '#/components/responses/Error' } } }
  /auth/student/activation/request:
    post: { operationId: requestActivation, requestBody: { $ref: '#/components/requestBodies/AccountRequest' }, responses: { '202': { description: Generic accepted response; delivery integration is deferred } } }
  /auth/student/activation/confirm:
    post: { operationId: confirmActivation, requestBody: { $ref: '#/components/requestBodies/TokenConfirm' }, responses: { '200': { description: Student account activated }, '400': { $ref: '#/components/responses/Error' } } }
  /auth/recovery/request:
    post: { operationId: requestRecovery, requestBody: { $ref: '#/components/requestBodies/AccountRequest' }, responses: { '202': { description: Generic accepted response } } }
  /auth/recovery/confirm:
    post: { operationId: confirmRecovery, requestBody: { $ref: '#/components/requestBodies/TokenConfirm' }, responses: { '200': { description: Password reset and prior sessions revoked } } }
  /me:
    get: { operationId: currentUser, security: [{ sessionCookie: [] }], responses: { '200': { description: Current user and permissions }, '401': { $ref: '#/components/responses/Error' } } }
  /inquiries:
    post:
      operationId: submitInquiry
      parameters: [{ in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InquiryRequest' } } } }
      responses: { '201': { description: Persisted inquiry }, '409': { description: Key reused with a different request }, '422': { $ref: '#/components/responses/Error' } }
  /admin/inquiries:
    get:
      summary: Paginated inquiries; existing status values, exact filters and bounded pages
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string } }
        - { in: query, name: course, schema: { type: string } }
        - { in: query, name: session, schema: { type: string } }
        - { in: query, name: batch, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: from, schema: { type: string } }
        - { in: query, name: to, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: pageSize, schema: { type: integer } }
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
  /admin/inquiries/{recordId}:
    parameters: [{ in: path, name: recordId, required: true, schema: { type: string } }]
    get:
      summary: Safe inquiries details; audit history restricted to admin
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
    patch:
      summary: Validated version-checked edit committed with immutable audit
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [version], minProperties: 2, properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 2, maxLength: 100 }, mobile: { type: string }, course: { type: string, minLength: 2, maxLength: 100 }, message: { type: string, maxLength: 500 }, status: { enum: [new, contacted, converted, closed] } } }
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
  /admin/students:
    get:
      summary: Paginated students; existing status values, exact filters and bounded pages
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string } }
        - { in: query, name: course, schema: { type: string } }
        - { in: query, name: session, schema: { type: string } }
        - { in: query, name: batch, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: from, schema: { type: string } }
        - { in: query, name: to, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: pageSize, schema: { type: integer } }
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
  /admin/students/{recordId}:
    parameters: [{ in: path, name: recordId, required: true, schema: { type: string } }]
    get:
      summary: Safe students details; audit history restricted to admin
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
    patch:
      summary: Validated version-checked edit committed with immutable audit
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [version], minProperties: 2, properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 2, maxLength: 120 }, mobile: { type: string }, email: { type: string, maxLength: 254 }, address: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
  /admin/admissions:
    get:
      summary: Paginated admissions; existing status values, exact filters and bounded pages
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string } }
        - { in: query, name: course, schema: { type: string } }
        - { in: query, name: session, schema: { type: string } }
        - { in: query, name: batch, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: from, schema: { type: string } }
        - { in: query, name: to, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: pageSize, schema: { type: integer } }
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
    post:
      summary: Create an admission using configured numbering and admission references
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
  /admin/admissions/setup:
    get:
      summary: Admission form reference courses and batch capacities
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Admin admission references }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/admissions/{recordId}:
    parameters: [{ in: path, name: recordId, required: true, schema: { type: string } }]
    get:
      summary: Safe admissions details; audit history restricted to admin
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
  /admin/inquiries/{recordId}/convert:
    parameters: [{ in: path, name: recordId, required: true, schema: { type: string } }]
    post:
      summary: Convert one inquiry to a linked admission; duplicate conversion is rejected
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
  /admin/students/{recordId}/mark-left:
    parameters: [{ in: path, name: recordId, required: true, schema: { type: string } }]
    post:
      summary: Admin-only left status; preserves student and financial history
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [version], properties: { version: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: Authorized management response }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Record version conflict or already converted }
        '422': { description: Invalid input }
  /admin/courses:
    get:
      summary: List courses with independent status and student count; no session or batch relationship is implied
      security: [{ sessionCookie: [] }]
      parameters: &academicListParameters
        - { in: query, name: query, schema: { type: string, maxLength: 160 } }
        - { in: query, name: status, schema: { type: string, enum: [active, inactive] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: &academicListResponses
        '200': { description: Paginated academic records }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Create an independent course and immutable audit event
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CourseWrite' } } } }
      responses: &academicWriteResponses
        '201': { description: Academic record created }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/courses/{recordId}:
    parameters: &academicRecordId [{ in: path, name: recordId, required: true, schema: { type: string } }]
    get: { summary: Get one course, security: [{ sessionCookie: [] }], responses: { '200': { description: Course record }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
    patch:
      summary: Version-checked course update with immutable audit
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/CourseWrite' }, { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }] } } } }
      responses: { '200': { description: Course updated }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/sessions:
    get: { summary: List independent academic sessions, security: [{ sessionCookie: [] }], parameters: *academicListParameters, responses: *academicListResponses }
    post:
      summary: Create an independent academic session and immutable audit event
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionWrite' } } } }
      responses: *academicWriteResponses
  /admin/sessions/{recordId}:
    parameters: *academicRecordId
    get: { summary: Get one academic session, security: [{ sessionCookie: [] }], responses: { '200': { description: Session record }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
    patch:
      summary: Version-checked session update with immutable audit
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SessionWrite' }, { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }] } } } }
      responses: { '200': { description: Session updated }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/batches:
    get: { summary: List global batch-time capacity records without course or session linkage, security: [{ sessionCookie: [] }], parameters: *academicListParameters, responses: *academicListResponses }
    post:
      summary: Create a global batch-time capacity record and immutable audit event
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BatchWrite' } } } }
      responses: *academicWriteResponses
  /admin/batches/{recordId}:
    parameters: *academicRecordId
    get: { summary: Get one global batch-time capacity record, security: [{ sessionCookie: [] }], responses: { '200': { description: Batch record with enrolled and available seats }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
    patch:
      summary: Version-checked batch capacity update; capacity cannot be below active enrollment
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/BatchWrite' }, { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }] } } } }
      responses: { '200': { description: Batch updated }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }  /students/me/summary:
    get: { operationId: ownStudentSummary, security: [{ sessionCookie: [] }], responses: { '200': { description: Authenticated student's own summary }, '403': { $ref: '#/components/responses/Error' } } }
  /students/{studentRecordId}/summary:
    get:
      operationId: administrativeStudentSummary
      security: [{ sessionCookie: [] }]
      parameters: [{ in: path, name: studentRecordId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Privileged read-only student summary }, '404': { $ref: '#/components/responses/Error' } }
  /students/me/portal:
    get:
      operationId: ownStudentPortal
      description: Session-owned extended read model. No ownership/filter query parameters accepted. Summary endpoint retains authoritative fee totals. PostgreSQL extended records return a pending state; synthetic snapshots include an explicit asOf date.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Own scoped portal data or integration-pending state
          content:
            application/json:
              schema: { type: object, required: [portal], properties: { portal: { $ref: './student-portal.schema.json' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /students/me/notices/{noticeId}/read:
    post:
      operationId: readOwnNotice
      description: Same-origin, CSRF-protected and audited read acknowledgement. Notice ownership derives solely from the session. Repeated acknowledgement retains readAt. Synthetic persistence only; unsupported repositories return 501. No request body is used.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ in: path, name: noticeId, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,100}$' } }]
      responses:
        '200':
          description: Own notice read state
          content:
            application/json:
              schema: { type: object, properties: { notice: { $ref: './student-portal.schema.json#/$defs/notice' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
  /students/me/receipts/{receiptId}/document:
    get:
      operationId: ownReceiptDocumentShell
      description: Authorized shell only. Own receipt returns 501 DOCUMENT_PENDING. Unknown or another student's receipt returns identical 404. No file paths, URLs or document blobs are returned. No document generation or public sequential endpoint exists.
      security: [{ sessionCookie: [] }]
      parameters: [{ in: path, name: receiptId, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,100}$' } }]
      responses:
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
  /admin/finance:
    get:
      summary: List saved fee snapshots, installments, posted payment history, dues, and receipt snapshots
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: kind, schema: { enum: [fees, installments, payments, dues, receipts] } }
        - { in: query, name: query, schema: { type: string, maxLength: 120 } }
        - { in: query, name: asOf, schema: { type: string, format: date } }
      responses: { '200': { description: Authorized financial read model }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /admin/finance/students/{studentId}:
    get:
      summary: One student's historical fee, installment, payment, due, and receipt read model
      security: [{ sessionCookie: [] }]
      parameters: [{ in: path, name: studentId, required: true, schema: { type: string } }]
      responses: { '200': { description: Financial read model }, '404': { $ref: '#/components/responses/Error' } }
  /admin/finance/students/{studentId}/payments:
    post:
      summary: Admin-only audited payment posting with unique receipt number and outstanding validation
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 100 } }]
      responses: { '201': { description: Posted payment and receipt snapshot }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/finance/students/{studentId}/payments/{paymentId}:
    patch:
      summary: Admin-only versioned audited payment correction; revision history is preserved
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses: { '200': { description: Corrected payment }, '409': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Admin-only audited logical reversal; payment and receipt history are preserved
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses: { '200': { description: Reversed payment }, '409': { $ref: '#/components/responses/Error' } }
  /admin/step6e:
    get:
      summary: List Step 6E notices, due reminders, certificates, or ID-card issue history
      description: Admin-only read model. Due reminders start seven days before the cumulative installment due date, include carry-forward, and exclude fully-paid students. WhatsApp remains manual; approved certificate and ID-card print layouts are available.
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: kind, required: true, schema: { enum: [notices, reminders, certificates, id-cards] } }
        - { in: query, name: asOf, schema: { type: string, format: date } }
      responses: { '200': { description: Step 6E read model }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /admin/step6e/notices:
    post:
      summary: Save an audited notice with an active/course/session/selected-student recipient snapshot
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses: { '201': { description: Notice and saved recipient history }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/step6e/reminders:
    post:
      summary: Record an eligible cumulative due reminder in history without invoking WhatsApp
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses: { '201': { description: Reminder history record }, '409': { $ref: '#/components/responses/Error' } }
  /admin/step6e/certificates:
    post:
      summary: Issue an audited eligible certificate
      description: Main certificate requires completed course and full payment. CVRU add-on gates are Data Entry 40%, MS Office 50%, and Accounting/Tally 60%. Issue date cannot precede course end.
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses: { '201': { description: Certificate issue record }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /admin/step6e/id-cards:
    post:
      summary: Create an audited ID-card issue record for an active student
      security: [{ sessionCookie: [], csrfToken: [] }]
