components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: fms_session }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
  requestBodies:
    AccountRequest: { required: true, content: { application/json: { schema: { type: object, required: [userId], properties: { userId: { type: string, minLength: 3, maxLength: 120 } } } } } }
    TokenConfirm: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 12, maxLength: 200 } } } } } }
  responses:
    Error: { description: Standard error envelope, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    Role: { type: string, enum: [admin, staff, student] }
    InquiryStatus: { type: string, enum: [new, contacted, converted, closed] }
    LoginRequest: { type: object, additionalProperties: false, required: [userId, password], properties: { userId: { type: string, minLength: 3, maxLength: 120 }, password: { type: string, minLength: 8, maxLength: 200 } } }
    InquiryRequest: { type: object, additionalProperties: false, required: [name, mobile, course, consent], properties: { name: { type: string, minLength: 2, maxLength: 100 }, mobile: { type: string, pattern: '^\\+?[0-9]{10,15}$' }, course: { type: string, minLength: 2, maxLength: 100 }, message: { type: string, maxLength: 500 }, consent: { type: boolean, const: true } } }
    CourseWrite: { type: object, additionalProperties: false, required: [code, name, duration, fee, status], properties: { code: { type: string, minLength: 1, maxLength: 80 }, name: { type: string, minLength: 1, maxLength: 160 }, duration: { type: string, maxLength: 100 }, fee: { type: number, minimum: 0, multipleOf: 0.01 }, status: { type: string, enum: [active, inactive] } } }
    SessionWrite: { type: object, additionalProperties: false, required: [name, startDate, endDate, status], properties: { name: { type: string, minLength: 1, maxLength: 160 }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, status: { type: string, enum: [active, inactive] } } }
    BatchWrite: { type: object, additionalProperties: false, required: [batch, capacity], properties: { batch: { type: string, minLength: 1, maxLength: 120 }, capacity: { type: integer, minimum: 1, maximum: 999 } } }
    ErrorEnvelope: { type: object, required: [error], properties: { error: { type: object, required: [code, message, requestId], properties: { code: { type: string }, message: { type: string }, requestId: { type: string } } } } }

